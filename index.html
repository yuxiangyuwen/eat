<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什么</title>
    
    <!-- 使用国内访问极快的字节跳动 CDN -->
    <link rel="stylesheet" href="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-1-M/pyscript/2022.06.1/pyscript.css" />
    <script defer src="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-1-M/pyscript/2022.06.1/pyscript.js"></script>

    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; text-align: center; font-size: 20px; }
        h1 { font-size: 36px; margin-bottom: 10px; color: #333; }
        .subtitle { color: #666; font-size: 16px; margin-bottom: 15px; }
        
        /* 输入框样式 */
        textarea { 
            width: 100%; height: 120px; font-size: 18px; 
            margin-bottom: 15px; padding: 12px; box-sizing: border-box; 
            border: 2px solid #ddd; border-radius: 8px; line-height: 1.5;
            outline: none; transition: border-color 0.3s;
        }
        textarea:focus { border-color: #007bff; }
        
        /* 按钮样式 */
        button { 
            font-size: 20px; font-weight: bold; padding: 12px 20px; 
            color: white; border: none; border-radius: 8px; 
            cursor: pointer; margin: 5px 0; width: 100%;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.8; }
        .btn-save { background-color: #4CAF50; }
        .btn-go { background-color: #007bff; }
        
        /* 状态提示和结果展示 */
        #status { font-size: 16px; color: #4CAF50; height: 24px; margin: 10px 0; font-weight: bold; }
        #output { font-size: 32px; font-weight: bold; color: #e74c3c; margin-top: 15px; line-height: 1.5; }
        
        /* 隐藏加载提示 */
        #loading { color: #999; font-size: 14px; }
    </style>
</head>
<body>
    <h1>今天吃什么</h1>
    <p class="subtitle">✏️ 在下方编辑菜单（格式：分类:菜1,菜2）</p>
    
    <textarea id="menu_input" placeholder="正在加载菜单，请稍候..."></textarea>
    
    <div>
        <button id="save-btn" class="btn-save">💾 保存我的菜单</button>
        <button id="go-btn" class="btn-go">🎲 帮我选一个！</button>
    </div>

    <div id="status"></div>
    <div id="output">等待选择...</div>
    <div id="loading">如果按钮没反应，说明 Python 引擎正在下载中，请耐心等几秒...</div>

    <!-- 使用国内稳定源加载 Python 核心 -->
    <script type="py" src="https://cdn.jsdelivr.net/pyodide/v0.20.0/full/pyodide.js">
import random
import js
from js import document, window

default_menu = "食堂:轻食,烤鸭饭,烤盘饭,重庆小面\n外卖:擂饭,打抛饭,越南法棍,肠粉"

def load_menu():
    menu_textarea = document.getElementById("menu_input")
    try:
        saved_menu = window.localStorage.getItem("my_custom_menu")
        if saved_menu:
            menu_textarea.value = saved_menu
        else:
            menu_textarea.value = default_menu
    except Exception:
        menu_textarea.value = default_menu
    document.getElementById("loading").style.display = "none"

def save_menu(event):
    menu_textarea = document.getElementById("menu_input")
    text = menu_textarea.value
    try:
        window.localStorage.setItem("my_custom_menu", text)
        document.getElementById("status").innerHTML = "✅ 菜单已保存！"
        window.setTimeout("document.getElementById('status').innerHTML = ''", 2000)
    except Exception as e:
        document.getElementById("status").style.color = "red"
        document.getElementById("status").innerHTML = "❌ 保存失败！"

def choose_food(event):
    menu_textarea = document.getElementById("menu_input")
    text = menu_textarea.value
    output_div = document.getElementById("output")
    
    # 去除空行
    lines = [line.strip() for line in text.split('\n') if line.strip() != ""]
    
    if len(lines) == 0:
        output_div.innerHTML = "❌ 菜单是空的，请先输入！"
        return

    # 判断是否包含冒号（分类模式）
    if ":" in lines[0] or "：" in lines[0]:
        places = []
        items = {}
        for line in lines:
            if ":" in line:
                place, food_list = line.split(":", 1)
            elif "：" in line:
                place, food_list = line.split("：", 1)
            else:
                continue
            
            place = place.strip()
            places.append(place)
            # 支持中英文逗号
            items[place] = [f.strip() for f in food_list.replace("，", ",").split(",") if f.strip()]

        if not places:
            output_div.innerHTML = "❌ 格式错误！"
            return

        p = random.choice(places)
        e = random.choice(items[p])
        result_html = f"今天吃：{p}<br>👉 {e}！"
    else:
        # 纯列表模式
        result = random.choice(lines)
        result_html = f"👉 去吃：{result}！"

    output_div.innerHTML = result_html

# 绑定按钮事件
document.getElementById("save-btn").addEventListener("click", save_menu)
document.getElementById("go-btn").addEventListener("click", choose_food)

# 页面加载时初始化菜单
load_menu()
    </script>
</body>
</html>
